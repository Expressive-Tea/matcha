[package]
name = "matcha-cli"
version = "26.8.0-beta.0"
edition = "2021"
description = "The green-tea CLI: scaffold a project, generate controllers, steps and providers already wired into their module, and run with your runtime detected. One native binary, no JS runtime needed to install it."
license = "MIT"
repository = "https://github.com/Expressive-Tea/matcha"

# The crate is `matcha-cli` on crates.io (the name `matcha` is taken), but the
# installed binary stays `matcha` — `cargo install matcha-cli` gives you `matcha`.
[[bin]]
name = "matcha"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
tree-sitter = "0.22"
tree-sitter-typescript = "0.21"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
